name: Incident Response
description: >
  Incident response and forensic analysis playbook. Covers evidence
  collection, log analysis, malware triage, IoC hunting, and
  containment recommendations. Read-only by default — active
  containment requires separate approval.
author:
  name: Pentest-Swarm AI
  github: Armur-Ai
version: 1.0.0
tags: [incident-response, forensics, threat-hunting, read-only-first]

variables:
  scope_file:
    type: string
    required: true
    description: Path to the signed scope YAML authorising this engagement
  incident_id:
    type: string
    required: true
    description: Unique identifier for this incident
  affected_systems:
    type: string
    required: true
    description: Comma-separated list of affected hostnames or IPs
  containment_mode:
    type: string
    default: read-only
    description: "read-only | isolate (isolate requires separate written approval)"

phases:
  - name: evidence_collection
    tools:
      - name: nuclei
        options:
          templates:
            - "incident-response/collection/"
            - "forensics/acquisition/"
    post_analysis: |
      Collect volatile evidence first: running processes, network
      connections, logged-in users, scheduled tasks, and loaded
      kernel modules. Preserve timestamps and chain of custody.
      Flag any anti-forensic indicators (log tampering, timestomp).

  - name: log_analysis
    tools:
      - name: nuclei
        options:
          templates:
            - "incident-response/logs/"
            - "forensics/timeline/"
    post_analysis: |
      Parse system logs, auth logs, web server logs, and cloud audit
      trails (CloudTrail, Audit Logs). Build a timeline of attacker
      activity. Identify initial access vector, lateral movement,
      and data exfiltration patterns.

  - name: malware_triage
    tools:
      - name: nuclei
        options:
          templates:
            - "incident-response/malware/"
            - "forensics/file-analysis/"
    post_analysis: |
      Triage suspicious binaries and scripts. Extract IoCs (hashes,
      C2 domains, registry keys, mutex names). Cross-reference with
      threat intelligence feeds. Flag ransom notes, webshells, and
      persistence mechanisms.

  - name: ioc_hunting
    tools:
      - name: nuclei
        options:
          templates:
            - "incident-response/hunting/"
            - "threat-hunting/enumeration/"
    post_analysis: |
      Hunt across the estate for identified IoCs. Check for lateral
      spread indicators: new admin accounts, WMI persistence, SSH
      authorized_keys additions, cron/Scheduled Task modifications.

  - name: containment_recommend
    tools:
      - name: nuclei
        options:
          templates:
            - "incident-response/containment/"
    post_analysis: |
      Generate containment recommendations prioritized by impact.
      If containment_mode is isolate, produce host-level isolation
      steps. Always include rollback procedures. Recommend
      eradication steps and recovery order.