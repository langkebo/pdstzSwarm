# Pentest Swarm AI — observability overlay
#
# This is an *additive* compose that brings up Prometheus,
# pg_exporter, and Grafana alongside the main stack declared in
# deploy/docker-compose.yml. Use it when you want metrics
# dashboards without manually wiring the exporters.
#
# Usage:
#
#   # 1. Start the main stack
#   docker compose -f deploy/docker-compose.yml up -d
#
#   # 2. Start observability
#   docker compose -f deploy/docker-compose.full.yml up -d
#
#   # 3. Open the dashboards
#   #    Prometheus: http://localhost:9090
#   #    Grafana:    http://localhost:3000 (admin / admin)
#   #    pg_exporter: http://localhost:9187/metrics
#
# Why this is a separate file
# ----------------------------
#
# Most operators want the app stack to start without Prometheus
# being a hard requirement. By splitting the observability plane
# into its own compose, we get:
#
#   - independent upgrade cycles (Prometheus 2.55 → 3.0 doesn't
#     require rebuilding the swarm image)
#   - different retention policies in production (the main stack
#     uses 15d, the app stack doesn't need a metrics store at all)
#   - the ability to disable the whole observability plane by
#     simply not bringing it up
#
# For a single-file deployment use the
# `deploy/scripts/up.sh --profile=full` helper, which `-f`'s both
# files in one command.

name: pentestswarm-observability

services:

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: psa-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      # The /metrics endpoint isn't usually authenticated; in a
      # public deployment front Prometheus with a reverse proxy
      # that adds basic auth.
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Reuse the main stack's network so the swarm's hostname
    # resolves to its container IP without us having to copy
    # IPs around.
    networks:
      - psa_internal
    depends_on:
      pentestswarm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /-/healthy returns 200 once Prometheus is ready to
      # serve queries. -w is needed because the default
      # Accept header is */*, not application/json, which
      # makes the promtool readiness endpoint 406.
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  pg_exporter:
    # Postgres metrics exporter. We use quay.io because the
    # `wrouesnel/postgres_exporter` image is the de-facto
    # standard and the one ptagent bundles.
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: psa-pg-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432
      DATA_SOURCE_USER: ${POSTGRES_USER:-pentestswarm}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-pentestswarm}
      DATA_SOURCE_DB: ${POSTGRES_DB:-pentestswarm}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      # Don't expose per-table metrics by default — they're
      # expensive on ptagent-class blackboards.
      PG_EXPORTER_INCLUDE_TBL_DATISTHRESHOLD: "-1"
    ports:
      - "9187:9187"
    networks:
      - psa_internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana:11.2.2
    container_name: psa-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana-swarm-dashboard.json:/var/lib/grafana/dashboards/swarm.json:ro
    networks:
      - psa_internal
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  prometheus_data:
    name: psa_prometheus_data
  grafana_data:
    name: psa_grafana_data

# Reuse the main stack's network. Both compose files declare
# `psa_internal` (the main file with `name: psa_internal`); the
# second declaration would normally fail with "network already
# exists", but `name: psa_internal` makes Docker treat them as
# the same network rather than a duplicate.
networks:
  psa_internal:
    name: psa_internal
    external: true
